<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 17px;
      }

      p {
        margin: 0 0 14px;
        color: #475569;
        font-size: 13px;
        line-height: 1.5;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        background: #0058be;
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }

      button.secondary {
        margin-top: 8px;
        background: #e2e8f0;
        color: #0f172a;
      }

      .url {
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid #dbe2ea;
        border-radius: 10px;
        background: #fff;
        color: #64748b;
        font-size: 12px;
        word-break: break-all;
      }

      .error {
        min-height: 16px;
        margin-top: 10px;
        color: #dc2626;
        font-size: 12px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <h1>Import Listing</h1>
    <p>Read the current Naver Land page and send the visible data to the work app.</p>
    <div id="current-url" class="url">Checking current tab...</div>
    <button id="send">Send to Work App</button>
    <button id="open-naver" class="secondary">Open Naver Land</button>
    <div id="error" class="error"></div>
    <script src="popup.js"></script>
  </body>
</html>
